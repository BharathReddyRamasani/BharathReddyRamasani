<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <style>
      .bg { fill: #071029; }
      .card { fill: rgba(255,255,255,0.02); stroke: rgba(255,255,255,0.04); stroke-width:1; rx:10; }
      .title { font: 800 36px/1.1 'Inter', system-ui, -apple-system, sans-serif; fill: url(#g); }
      .subtitle { font: 500 15px/1.1 'Inter', system-ui, -apple-system, sans-serif; fill: #93c5fd; }
      .meta { font: 500 12px/1.1 'Inter', system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .pill { font: 500 12px/1.1 'Inter', system-ui, -apple-system, sans-serif; fill: #c7d2fe; }
      .dot { transform-origin: 50% 50%; animation: float 3s ease-in-out infinite; }
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="12" />

  <g transform="translate(40,34)">
    <text x="0" y="36" class="title">Bharath Reddy</text>
    <text x="0" y="66" class="subtitle">Full‑stack · ML · Data · Interactive UX</text>

    <!-- animated dots -->
    <g transform="translate(0,92)">
      <circle class="dot" cx="20" cy="20" r="10" fill="#10b981" opacity="0.95"/>
      <circle class="dot" cx="60" cy="16" r="6" fill="#3b82f6" opacity="0.95"/>
      <circle class="dot" cx="100" cy="22" r="8" fill="#f97316" opacity="0.95"/>
    </g>

    <text x="140" y="108" class="meta">Corpus · Emotion · Neus · Emotion Aware · Forecast</text>
  </g>

  <!-- tech cards -->
  <g transform="translate(28,140)">
    <!-- Card 1 -->
    <g transform="translate(0,0)">
      <rect class="card" width="164" height="110" rx="10" />
      <text x="20" y="28" class="subtitle">Generative AI &amp; NLP</text>
      <text x="20" y="48" class="pill">LLMs · RAG · LangChain</text>
      <text x="20" y="66" class="pill">Transformers · Deep Learning</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(176,0)">
      <rect class="card" width="164" height="110" rx="10" />
      <text x="20" y="28" class="subtitle">Data Science &amp; ML</text>
      <text x="20" y="48" class="pill">Pandas · NumPy · scikit‑learn</text>
      <text x="20" y="66" class="pill">Feature Eng · Recommendation</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(352,0)">
      <rect class="card" width="164" height="110" rx="10" />
      <text x="20" y="28" class="subtitle">Languages</text>
      <text x="20" y="48" class="pill">Python · Java · JavaScript · SQL</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(528,0)">
      <rect class="card" width="164" height="110" rx="10" />
      <text x="20" y="28" class="subtitle">Full‑Stack &amp; APIs</text>
      <text x="20" y="48" class="pill">React · Next.js · Node.js</text>
      <text x="20" y="66" class="pill">FastAPI · Express · REST</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(704,0)">
      <rect class="card" width="164" height="110" rx="10" />
      <text x="20" y="28" class="subtitle">Databases &amp; Tools</text>
      <text x="20" y="48" class="pill">Postgres · MongoDB · Docker</text>
      <text x="20" y="66" class="pill">Kubernetes · Git · ChromaDB</text>
    </g>
  </g>
</svg>

<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <style>
      .title { font: 700 32px/1.1 'Inter', system-ui, -apple-system, sans-serif; fill: url(#g); }
      .subtitle { font: 500 16px/1.1 'Inter', system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .dot { transform-origin: 50% 50%; animation: float 3s ease-in-out infinite; }
      @keyframes float {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.03); }
        100% { transform: translateY(0px) scale(1); }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" rx="12" />
  <g transform="translate(40,40)">
    <text x="0" y="28" class="title">Bharath Reddy</text>
    <text x="0" y="56" class="subtitle">Full-stack · ML · Data · Animation-driven UX</text>

    <g transform="translate(0,90)">
      <circle class="dot" cx="20" cy="20" r="10" fill="#10b981" opacity="0.95"/>
      <text x="40" y="26" class="subtitle">Corpus · Emotion · Neus · Emotion Aware · Forecast</text>
    </g>
  </g>
</svg>
